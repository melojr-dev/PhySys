limit_req_zone $binary_remote_addr zone=physioai_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=physioai_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=physioai_conn:10m;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 520M;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;


    location = /api/auth/login {
        limit_req zone=physioai_login burst=5 nodelay;
        proxy_pass http://backend:8000/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Preflight também recebe o vídeo completo. Mantém streaming até o FastAPI
    # para evitar buffer duplicado no proxy; o arquivo é reutilizado pela análise.
    location = /api/capture/preflight {
        limit_req zone=physioai_api burst=10 nodelay;
        limit_conn physioai_conn 4;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://backend:8000/api/capture/preflight;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Upload de vídeo: encaminha o corpo em streaming para o FastAPI.
    # Evita duplicar centenas de MB no buffer temporário do Nginx antes que
    # _stage_upload() possa aplicar os limites e calcular SHA-256.
    location = /api/analise/processar {
        limit_req zone=physioai_api burst=10 nodelay;
        limit_conn physioai_conn 4;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://backend:8000/api/analise/processar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        limit_req zone=physioai_api burst=40 nodelay;
        limit_conn physioai_conn 20;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /ws/ {
        limit_conn physioai_conn 8;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /version {
        proxy_pass http://backend:8000/version;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://backend:8000/ready;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
